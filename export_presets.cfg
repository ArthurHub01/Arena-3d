[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/arena3d.exe"
patch_list=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/icon.ico"
application/console_wrapper_icon="res://assets/icon.ico"
application/icon_interpolation=4
application/file_version="1.0.0"
application/product_version="1.0.0"
application/company_name=""
application/product_name="Arena 3D"
application/file_description="Arena 3D - Beta 1.0"
application/copyright=""
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
d3d12/agility_sdk_multizip=true
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="Expand-Archive -LiteralPath '{temp_dir}\\{archive_name}' -DestinationPath '{temp_dir}'
$action = New-ScheduledTaskAction -Execute '{temp_dir}\\{exe_name}' -Argument '{cmd_args}'
$trigger = New-ScheduledTaskTrigger -Once -At 00:00
$settings = New-ScheduledTaskSettingsSet
$task = New-ScheduledTask -Action $action -Trigger $trigger -Settings $settings
Register-ScheduledTask '{temp_dir}\\{exe_name}' -InputObject $task -Force:$true
Start-ScheduledTask -TaskName '{temp_dir}\\{exe_name}'
while (Get-ScheduledTask -TaskName '{temp_dir}\\{exe_name}' | Where-Object State -eq running) { Start-Sleep -Milliseconds 100 }
Unregister-ScheduledTask -TaskName '{temp_dir}\\{exe_name}' -Confirm:$false"
ssh_remote_deploy/cleanup_script="Stop-ScheduledTask -TaskName '{temp_dir}\\{exe_name}'
Unregister-ScheduledTask -TaskName '{temp_dir}\\{exe_name}' -Confirm:$false
Remove-Item -Recurse -Force '{temp_dir}'"

[preset.1]

name="Linux Desktop"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="builds/arena3d.x86_64"
patch_list=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
binary_format/embed_pck=true
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="#!/usr/bin/env bash
export DISPLAY=:0
unzip -o -q \"{temp_dir}/{archive_name}\" -d \"{temp_dir}\"
chmod +x \"{temp_dir}/{exe_name}\"
\"{temp_dir}/{exe_name}\" {cmd_args}"
ssh_remote_deploy/cleanup_script="#!/usr/bin/env bash
kill $(pgrep -f \"{temp_dir}/{exe_name}\")
rm -rf \"{temp_dir}\""
